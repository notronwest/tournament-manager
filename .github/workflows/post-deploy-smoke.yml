# Does the thing we just shipped actually RENDER?
#
# 2026-10-09: a promotion put a public recap page on PROD that threw on every
# load and rendered nothing. Migrations green, edge functions green, deploy
# green — all three honestly reporting their own step, over a blank page. Ron
# found it by opening it, hours later.
#
# Every check we had asked "did my step finish?". This asks "is it there?"
# (D-0083: a self-report must be derived from the OUTCOME).
name: Post-deploy smoke (production)

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  smoke:
    # Pinned, not ubuntu-latest: GitHub moved `latest` to Ubuntu 26.04, for which
    # Playwright 1.60 ships no chromium build, so `playwright install` exits 1 and
    # the job fails before running a single test. It failed that way unnoticed from
    # at least 2026-11-05, and on 2026-11-07 it took the production post-deploy
    # smoke with it — a promotion deployed with its smoke never executed. Unpin once
    # a Playwright release supports 26.04 and this repo is on it (see DEPLOYMENT.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Cloudflare Pages builds asynchronously and we hold no API token, so we
      # cannot ask "is the deploy done?". We can ask the page: wait until the
      # JS bundle hash is no longer the one that was live when this run began.
      # Timing out here FAILS the job — a deploy that never arrives is exactly
      # as bad as one that arrives broken, and must not pass quietly.
      - name: Wait for the new bundle to be serving
        id: landed
        run: |
          url="https://bertanderne.com"
          before="$(curl -fsS --max-time 20 "$url" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
          echo "bundle before: ${before:-unknown}"
          for i in $(seq 1 60); do
            now="$(curl -fsS --max-time 20 "$url" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
            if [ -n "$now" ] && [ "$now" != "$before" ]; then
              echo "bundle now: $now — deploy is live after $((i*15))s"; exit 0
            fi
            sleep 15
          done
          echo "::error::the new bundle never started serving within 15 minutes — the deploy did not land"
          exit 1

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - name: Install the test browser
        id: browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Smoke the public pages
        id: smoke
        working-directory: web
        env:
          E2E_BASE_URL: https://bertanderne.com
        run: npx playwright test e2e/smoke-public.spec.ts --project=chromium --reporter=line

      # A production smoke that fails where nobody is told is not a safety net.
      # Until 2026-11-07 this job reported NOTHING: it went red on the night of a
      # real promotion and the only reason anyone knew was that someone went and
      # looked. It also matters WHICH stage broke — "the deploy never landed",
      # "the browser would not install" and "a public page is broken" need three
      # different responses, and the middle one means no test ran at all.
      # Inline curl rather than a shared notifier because that is this repo's
      # existing shape (see migrations.yml and edge-functions.yml).
      - name: Say so if the production smoke did not pass
        if: always() && steps.smoke.outcome != 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.landed.outcome }}" != "success" ]; then
            msg="❌ PROD smoke: the deploy never started serving. The promotion merged but bertanderne.com is still on the old bundle. $run_url"
          elif [ "${{ steps.browsers.outcome }}" != "success" ]; then
            msg="❌ PROD smoke DID NOT RUN — the test browser would not install, so production shipped unsmoked. This is not a failing test; it is no test. $run_url"
          else
            msg="❌ PROD smoke FAILED on a real check — a public page on bertanderne.com is broken after the promotion. $run_url"
          fi
          echo "$msg"
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::no webhook configured — this failure reached no channel, which looks exactly like a quiet pass"
            exit 0
          fi
          curl -fsS -m 20 -X POST -H "Content-Type: application/json" \
            -d "$(jq -Rn --arg m "$msg" '{content:$m}')" "$DISCORD_WEBHOOK" >/dev/null \
            || echo "::warning::the webhook refused the post — this failure reached no channel"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: web/test-results/
          retention-days: 7
