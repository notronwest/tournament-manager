<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Tournament Manager"
    />
    <!-- viewport-fit=cover handles iPhone notch/safe-area; the
         maximum-scale + user-scalable=no pair stops mobile Safari
         from auto-zooming the layout when an input is focused. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- V5 brand fonts: Alfa Slab One (display) + Anton (UI heading) +
         IBM Plex Mono (label/crumb) + Inter (body) -- self-hosted via
         @fontsource, imported in main.tsx (see issue #735: offline mode
         must never fetch fonts.googleapis.com / fonts.gstatic.com). -->
    <title>bert &amp; erne — pickleball tournaments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
